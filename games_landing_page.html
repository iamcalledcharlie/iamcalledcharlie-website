<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fun Games</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      font-family: 'Press Start 2P', monospace;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 1.8rem;
      color: #ffe66d;
      text-shadow: 4px 4px 0 #e63946;
      margin-bottom: 10px;
      letter-spacing: 2px;
      text-align: center;
    }

    .subtitle {
      font-size: 0.5rem;
      color: #aaa;
      margin-bottom: 40px;
      letter-spacing: 3px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      max-width: 900px;
      width: 100%;
    }

    .game-card {
      background: #16213e;
      border: 3px solid #ffe66d;
      padding: 24px 20px;
      text-align: center;
      text-decoration: none;
      color: #fff;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 4px 4px 0 #e63946;
      display: block;
    }

    .game-card:hover {
      transform: translate(-3px, -3px);
      box-shadow: 7px 7px 0 #e63946;
    }

    .game-card:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #e63946;
    }

    .game-icon {
      font-size: 2.5rem;
      margin-bottom: 14px;
      display: block;
    }

    .game-title {
      font-size: 0.6rem;
      color: #ffe66d;
      line-height: 1.6;
    }

    .game-new {
      display: inline-block;
      margin-top: 10px;
      background: #e63946;
      color: #fff;
      font-size: 0.4rem;
      padding: 3px 8px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <h1>FUN GAMES</h1>
  <p class="subtitle">CLICK A GAME TO PLAY</p>

  <div class="games-grid">

    <a href="flappy_bird.html" class="game-card">
      <span class="game-icon">🐦</span>
      <div class="game-title">FLAPPY BIRD</div>
      <span class="game-new">★ NEW</span>
    </a>

    <a href="space_explorer.html" class="game-card">
      <span class="game-icon">🚀</span>
      <div class="game-title">SPACE EXPLORER</div>
    </a>

    <a href="pong.html" class="game-card">
      <span class="game-icon">🏓</span>
      <div class="game-title">ATARI 2600 PONG</div>
    </a>

    <a href="pitfall.html" class="game-card">
      <span class="game-icon">🌴</span>
      <div class="game-title">PITFALL ADVENTURE</div>
    </a>

  </div>

</body>
</html>
